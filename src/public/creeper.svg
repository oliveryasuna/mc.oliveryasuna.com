<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#5b9a3e"/>
  <g fill="#3f7a2a">
    <rect x="0" y="0" width="4" height="4"/>
    <rect x="12" y="8" width="4" height="4"/>
    <rect x="24" y="4" width="4" height="4"/>
    <rect x="4" y="20" width="4" height="4"/>
    <rect x="28" y="24" width="4" height="4"/>
    <rect x="16" y="28" width="4" height="4"/>
  </g>
  <g fill="#0d1f0a">
    <!-- Eyes -->
    <rect x="4" y="4" width="8" height="8"/>
    <rect x="20" y="4" width="8" height="8"/>
    <!-- Nose / mouth -->
    <rect x="12" y="12" width="8" height="8"/>
    <rect x="8" y="16" width="16" height="8"/>
    <rect x="8" y="24" width="4" height="4"/>
    <rect x="20" y="24" width="4" height="4"/>
  </g>
